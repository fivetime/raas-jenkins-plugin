name: build

# Every push builds and tests the plugin. A tag `v*` also publishes the .hpi to a GitHub Release;
# that file is what tenants upload into their Jenkins (README → Install).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: mvn -B -ntp verify -Dchangelist=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '999999-SNAPSHOT' }}
      - uses: actions/upload-artifact@v4
        with:
          name: raas-jenkins.hpi
          path: target/raas-jenkins.hpi
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/raas-jenkins.hpi
          generate_release_notes: true
